# Alembic configuration. Deliberately minimal: everything the generated file
# normally carries as commented-out defaults has been dropped, so what remains
# is what this project actually sets.
#
# There is no sqlalchemy.url here, on purpose. alembic/env.py reads it from
# Settings at runtime, which keeps credentials out of a committed file and stops
# migrations and the app disagreeing about which database they point at.

[alembic]
script_location = alembic

# Date-prefixed so `ls versions/` is chronological. The revision hash alone
# sorts arbitrarily, which makes a long history hard to read at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Alembic is run from the repo root, so `core` and `adapters` import cleanly.
prepend_sys_path = .

version_path_separator = os

# Generated migrations go through the same formatter as everything else, so a
# revision is never the one file in the tree that fails `make lint`.
[post_write_hooks]
# `exec`, not `console_scripts`: ruff ships a binary rather than a Python entry
# point, so alembic cannot import it. `uv run alembic` puts .venv/bin on PATH,
# which is where this finds it.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
